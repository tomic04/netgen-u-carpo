# Jednokratni uvoz XML-ova s diska sql-ai (C:\NetGenXml) u definitions/netgen/Zito.
# Radi samo na granama uvoz/**; commit ide na istu granu.
name: uvoz-xml

on:
  push:
    branches:
      - 'uvoz/**'

permissions:
  contents: write

jobs:
  uvoz:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, sql-ai]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kopiraj i commitaj
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $izvor = "C:\NetGenXml"
          if (-not (Test-Path -LiteralPath $izvor)) { throw "Nema $izvor" }
          Write-Host "Sadrzaj ${izvor}:"
          Get-ChildItem -LiteralPath $izvor -Recurse | ForEach-Object { Write-Host ("  " + $_.FullName.Substring($izvor.Length) + "`t" + $(if ($_.PSIsContainer) { "<mapa>" } else { $_.Length })) }
          # Korijen: silazi dok mapa ima samo jednu podmapu i nijednu datoteku (C:\NetGenXml\<ime>\<ime>).
          $korijen = $izvor
          while ($true) {
            $mape = @(Get-ChildItem -LiteralPath $korijen -Directory)
            $dat = @(Get-ChildItem -LiteralPath $korijen -File)
            if ($mape.Count -eq 1 -and $dat.Count -eq 0) { $korijen = $mape[0].FullName } else { break }
          }
          Write-Host "korijen: $korijen"
          $cilj = Join-Path $env:GITHUB_WORKSPACE "definitions\netgen\Zito"
          if (Test-Path -LiteralPath $cilj) { Remove-Item -LiteralPath $cilj -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cilj | Out-Null
          $n = 0
          Get-ChildItem -LiteralPath $korijen -Recurse -File | Where-Object { $_.Extension -ieq ".xml" } | ForEach-Object {
            $rel = $_.FullName.Substring($korijen.Length).TrimStart('\')
            $dest = Join-Path $cilj $rel
            $dir = Split-Path -Parent $dest
            if (-not (Test-Path -LiteralPath $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
            Copy-Item -LiteralPath $_.FullName -Destination $dest -Force
            $n++
          }
          Write-Host "kopirano XML-ova: $n"
          if ($n -eq 0) { throw "Nema XML-ova u $izvor" }
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A -- "definitions/netgen/Zito"
          git commit -m "Uvoz XML-ova s sql-ai (C:\NetGenXml) u definitions/netgen/Zito"
          git push origin HEAD:${{ github.ref_name }}
