# Build Carpo.sln na self-hosted Windows runneru sql-ai.
# DLL-ovi i DevExpress se ne committaju. SharedAssembliesDir pokazuje na
# kopiju u workspaceu, slozenu iz Jupiter Client mape na runneru.
# Pojedinacni pad NetGen XML-a u smoke testu ne rusi job. Invarijanta parsera rusi.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, sql-ai]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spin stubovi i otvaranje
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sql = Join-Path $env:GITHUB_WORKSPACE "scripts\spin\stubovi.sql"
          sqlcmd -S localhost -d spin -E -C -b -i $sql
          if ($LASTEXITCODE -ne 0) { throw "stubovi.sql nije prosao" }
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\spin\Prenesi.ps1")
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\spin\FakParTijelo.ps1")
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\spin\Retci.ps1")
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\spin\Otvori.ps1")

      - name: Artifact spin otvaranje
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spin-otvaranje
          if-no-files-found: warn
          path: artifacts/spin/

      - name: Priprema referenci i build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msb = "C:\Program Files\Microsoft Visual Studio\18\Community\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msb)) {
            throw "Nema MSBuild: $msb"
          }

          $jupiter = "C:\Users\ntomic\Desktop\Jupiter Client\Programs\SharedAssemblies"
          if (-not (Test-Path $jupiter)) {
            throw "Nema Jupiter SharedAssemblies: $jupiter"
          }

          $dxRoot = "C:\Program Files\DevExpress 26.1\Components"
          $dx = Join-Path $dxRoot "Bin\Framework"
          $probe = Join-Path $dx "DevExpress.Data.v26.1.dll"
          if (-not (Test-Path $probe)) {
            $found = Get-ChildItem -Path $dxRoot -Filter "DevExpress.Data.v26.1.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              throw "Nema DevExpress.Data.v26.1.dll pod $dxRoot. Instaliran DevExpress 26.1 (build 26.1.3.0, PublicKeyToken b88d1754d700e49a) treba biti na tom stroju. NuGet feed sam ne spaja reference bez HintPath."
            }
            $dx = $found.DirectoryName
          }
          Write-Host "DevExpress bin: $dx"

          $refs = Join-Path $env:GITHUB_WORKSPACE "artifacts\refs"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\bin"
          New-Item -ItemType Directory -Force -Path (Join-Path $refs "Spin") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $refs "Microsoft") | Out-Null
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $treba = @(
            "JupiterTranslator10.dll",
            "JupiterLogger.dll",
            "RibbonBase.v26.dll",
            "Spin.Printing.v26.dll",
            "SpinDMSUtil.dll",
            "Microsoft.Office.Interop.Outlook.dll",
            "Dimenzije.dll"
          )
          $nema = @()
          foreach ($n in $treba) {
            $src = Join-Path $jupiter "Spin\$n"
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $refs "Spin\$n") -Force
            } else {
              $nema += $n
            }
          }

          $adodb = Join-Path $jupiter "Microsoft\adodb.dll"
          $adodbVs = "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\PublicAssemblies\adodb.dll"
          if (Test-Path $adodb) {
            Copy-Item $adodb (Join-Path $refs "Microsoft\adodb.dll") -Force
          } elseif (Test-Path $adodbVs) {
            Copy-Item $adodbVs (Join-Path $refs "Microsoft\adodb.dll") -Force
            Write-Host "adodb.dll uzet iz VS PublicAssemblies (nema ga u SharedAssemblies\Microsoft)."
          } else {
            $nema += "adodb.dll"
          }

          if ($nema.Count -gt 0) {
            throw ("Na runneru fale DLL-ovi (ne committaju se, trebaju u Jupiter Client\Programs\SharedAssemblies): " + ($nema -join ", "))
          }

          # Postojeci Carpo.*.dll su samo pocetna sjemenka. Svaki projekt poslije
          # prepisuje svoj izlaz u refs\Spin, jer HintPath ne gleda OutputPath.
          $sjeme = @(
            "Carpo.Structure.dll", "Carpo.Common.dll", "Carpo.Data.dll", "Carpo.Core.dll",
            "Carpo.UI.dll", "Carpo.dll", "Carpo.XmlGen.dll"
          )
          foreach ($n in $sjeme) {
            $src = Join-Path $jupiter "Spin\$n"
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $refs "Spin\$n") -Force
            }
          }

          if (-not $out.EndsWith("\")) { $out = $out + "\" }
          $pShared = "/p:SharedAssembliesDir=$refs"
          $pOut = "/p:OutputPath=$out"
          $pDx = "/p:DevExpressBinDir=$dx"

          # Redoslijed je lanac HintPatha (dokument 07/09), ne jedan msbuild na sln
          # u paraleli: inace Common trazi Structure.dll prije nego je izvor izgraden.
          $projekti = @(
            "Devex_26\Carpo.Structure\Carpo.Structure.csproj",
            "Devex_26\Carpo.Common\Carpo.Common.csproj",
            "Devex_26\Carpo.Data\Carpo.Data.csproj",
            "Devex_26\Carpo.Core\Carpo.Core.csproj",
            "Devex_26\Carpo.UI\Carpo.UI.csproj",
            "Devex_26\Carpo.Gen\Carpo.csproj",
            "Devex_26\Carpo.XmlGen\Carpo.XmlGen.csproj",
            "Devex_26\Carpo.CMS\Carpo.CMS.csproj",
            "Devex_26\Carpo.NetGen\Carpo.NetGen.csproj",
            "Devex_26\Carpo.NetGen.Corpus\Carpo.NetGen.Corpus.csproj",
            "Devex_26\Carpo.NetGen.GridTest\Carpo.NetGen.GridTest.csproj",
            "Devex_26\Carpo.NetGen.Defaults\Carpo.NetGen.Defaults.csproj",
            "tests\Carpo.NetGen.Granule\Carpo.NetGen.Granule.csproj",
            "Devex_26\Carpo.Lite\Carpo.Lite.csproj",
            "Devex_26\Carpo.Specific\Carpo.Specific.csproj",
            "Devex_26\Carpo.Designer\Carpo.Designer.csproj",
            "Devex_26\Carpo.TestShell\Carpo.TestShell.csproj"
          )

          foreach ($p in $projekti) {
            Write-Host "=== $p ==="
            & $msb (Join-Path $env:GITHUB_WORKSPACE $p) /t:Build /m:1 /nologo /v:minimal /p:Configuration=Debug /p:Platform=AnyCPU $pShared $pOut $pDx
            if ($LASTEXITCODE -ne 0) {
              throw "Build pao: $p"
            }
            Copy-Item ($out + "*.dll") (Join-Path $refs "Spin") -Force
          }

          Write-Host "Build gotov: $out"

      - name: Smoke NetGen XML
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\bin"
          $exe = Join-Path $out "Carpo.NetGen.Corpus.exe"
          if (-not (Test-Path $exe)) { throw "Nema $exe" }
          $smoke = Join-Path $env:GITHUB_WORKSPACE "artifacts\smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          & $exe `
            (Join-Path $env:GITHUB_WORKSPACE "definitions\netgen") `
            (Join-Path $env:GITHUB_WORKSPACE "definitions\Prepisane_granule\Netgen") `
            --izvjestaj (Join-Path $smoke "izvjestaj.txt") `
            --tsv (Join-Path $smoke "korpus.tsv")
          if ($LASTEXITCODE -ne 0) {
            throw "Smoke invarijante parsera nisu prosle (OznakaKL, JeziciNG, HIGHT, TYPE, UTF-16). Pad pojedinog drugog XML-a je u FAILED_LIST i sam ne ruši run."
          }

      - name: Grid testovi i defaulti
        shell: powershell
        env:
          CARPO_SPIN: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\bin"
          $def = Join-Path $env:GITHUB_WORKSPACE "artifacts\defaults"
          New-Item -ItemType Directory -Force -Path $def | Out-Null
          & (Join-Path $out "Carpo.NetGen.GridTest.exe")
          if ($LASTEXITCODE -ne 0) { throw "Grid testovi nisu prosli. Vidi PASS/FAIL iznad." }
          $dx = "C:\Program Files\DevExpress 26.1\Components\Bin\Framework"
          & (Join-Path $out "Carpo.NetGen.Defaults.exe") `
            --jupiter "C:\Users\ntomic\Desktop\Jupiter Client" `
            --dx $dx `
            --izlaz (Join-Path $def "grid-defaults.tsv")
          if ($LASTEXITCODE -ne 0) { throw "Defaults alat je pao." }
          Write-Host "---- asm sonda (pocetak) ----"
          Get-Content (Join-Path $def "asm-sonda.txt") -TotalCount 80
          & (Join-Path $out "Carpo.NetGen.Granule.exe") $env:GITHUB_WORKSPACE --izvjestaj (Join-Path $env:GITHUB_WORKSPACE "artifacts\granule\izvjestaj.txt")
          if ($LASTEXITCODE -ne 0) { throw "QA granule: ima padova. Otvorene stavke ne ruse build. Vidi artifacts/granule/izvjestaj.txt" }
          & (Join-Path $out "Carpo.NetGen.Granule.exe") $env:GITHUB_WORKSPACE --ssmeni (Join-Path $env:GITHUB_WORKSPACE "artifacts\granule\smoke-spin.md")
          if ($LASTEXITCODE -ne 0) { throw "ssMeni smoke nije procitao izbornik." }
          Get-Content (Join-Path $env:GITHUB_WORKSPACE "artifacts\granule\smoke-spin.md")

      - name: Jupiter smoke
        # Korisnik je zabranio svaki upit prema jupiter2019 i jupiter2022.
        if: false
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\bin"
          $md = Join-Path $env:GITHUB_WORKSPACE "docs\granule\smoke-jupiter.md"
          & (Join-Path $out "Carpo.NetGen.Granule.exe") $env:GITHUB_WORKSPACE --jupiter $md
          if ($LASTEXITCODE -eq 3) { throw "Jupiter smoke je poslao upis. Vidi docs/granule/smoke-jupiter.md" }
          if ($LASTEXITCODE -ne 0) { throw "Jupiter smoke nije zavrsio. Kod $LASTEXITCODE" }
          Get-Content -LiteralPath $md -TotalCount 30

      - name: Stabilni TestShell na sql-ai
        shell: powershell
        env:
          NETGEN_GRANA: ${{ github.head_ref || github.ref_name }}
          NETGEN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $korijen = "C:\NetGenCarpo"
          $grana = $env:NETGEN_GRANA
          if ([string]::IsNullOrWhiteSpace($grana)) { throw "Nema imena grane." }
          $ime = $grana.Replace("/", "_").Replace("\", "_")
          if ($ime -match '^\.+$' -or $ime.Contains(":")) { throw "Neispravno ime grane: $ime" }
          if (-not (Test-Path -LiteralPath $korijen)) {
            New-Item -ItemType Directory -Path $korijen | Out-Null
          }
          $cilj = Join-Path $korijen $ime
          $pun = [System.IO.Path]::GetFullPath($cilj)
          $korijenPun = [System.IO.Path]::GetFullPath($korijen)
          if (-not $pun.StartsWith($korijenPun + "\", [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Cilj nije unutar ${korijen}: $pun"
          }
          $ErrorActionPreference = "Continue"
          if (Test-Path -LiteralPath $pun) {
            cmd /c "rmdir /s /q `"$pun`"" | Out-Null
          }
          $bin = Join-Path $pun "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pun "definitions") | Out-Null
          Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "artifacts\bin") -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Join-Path $env:GITHUB_WORKSPACE "artifacts\bin").Length).TrimStart('\')
            $dest = Join-Path $bin $rel
            $destDir = Split-Path -Parent $dest
            if (-not (Test-Path -LiteralPath $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }
            try { Copy-Item -LiteralPath $_.FullName -Destination $dest -Force -ErrorAction Stop }
            catch { Write-Host "nije zamijenjeno (otvoreno): $dest" }
          }
          try {
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "definitions\netgen") -Destination (Join-Path $pun "definitions") -Recurse -Force -ErrorAction Stop
          } catch { Write-Host "definitions nisu sve kopirane: $($_.Exception.Message)" }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "Carpo.TestShell.exe"))) {
            throw "Nema Carpo.TestShell.exe u $bin"
          }
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $bin "Carpo.TestShell.exe"
          $snimke = Join-Path $env:GITHUB_WORKSPACE "artifacts\ui-smoke"
          try {
            & (Join-Path $env:GITHUB_WORKSPACE "scripts\ui\UiSmoke.ps1") -Exe $exe -XmlRoot (Join-Path $pun "definitions\netgen") -Shots $snimke
            if ($LASTEXITCODE -ne 0) { throw "UI smoke nije prosao. Kod $LASTEXITCODE" }
            $vrijeme = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $tekst = "grana: $grana`r`ncommit: $env:NETGEN_COMMIT`r`nvrijeme: $vrijeme`r`nexe: $exe`r`nxml: $(Join-Path $pun 'definitions\netgen')`r`n"
            Set-Content -LiteralPath (Join-Path $korijen "zadnji.txt") -Value $tekst -Encoding UTF8
            & icacls $korijen /grant "ntomic:(OI)(CI)RX" "*S-1-5-32-545:(OI)(CI)RX" /T /C
            if ($LASTEXITCODE -gt 1) { throw "icacls je vratio $LASTEXITCODE" }
            Write-Host "Stabilni TestShell: $exe"
          } finally {
            & (Join-Path $env:GITHUB_WORKSPACE "scripts\ui\Ocisti.ps1") -Korijen $korijen
          }

      - name: Artifact TestShell, NetGen, grid i defaulti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carpo-grid
          if-no-files-found: warn
          path: |
            artifacts/bin/Carpo.NetGen.dll
            artifacts/bin/Carpo.NetGen.pdb
            artifacts/bin/Carpo.NetGen.Corpus.exe
            artifacts/bin/Carpo.NetGen.Corpus.pdb
            artifacts/bin/Carpo.NetGen.GridTest.exe
            artifacts/ui-smoke/
            artifacts/bin/Carpo.NetGen.Defaults.exe
            artifacts/bin/Carpo.TestShell.exe
            artifacts/bin/Carpo.TestShell.pdb
            artifacts/smoke/izvjestaj.txt
            artifacts/smoke/korpus.tsv
            artifacts/defaults/grid-defaults.tsv
            artifacts/defaults/asm-sonda.txt
            artifacts/granule/izvjestaj.txt
            artifacts/granule/smoke-spin.md
            docs/granule/smoke-jupiter.md
            artifacts/bin/Carpo.NetGen.Granule.exe
